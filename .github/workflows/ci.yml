name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: soundwave

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        run: flutter analyze

      - name: Tests
        run: flutter test
